# fly.toml app configuration file generated for qb-auditor-backend on 2026-07-31T22:47:56-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'qb-auditor-backend'
primary_region = 'iad'

[build]
[env]
  QBO_ENVIRONMENT = 'production'

[[mounts]]
  source = 'qb_auditor_data'
  destination = '/data'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
