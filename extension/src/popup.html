<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; margin: 0; padding: 14px; width: 260px; color: #111; }
    h1 { font-size: 15px; margin: 0 0 10px 0; }
    .status { padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.bad { background: #fee2e2; color: #991b1b; }
    button { background: #111; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; width: 100%; }
    button:hover { background: #333; }
    .muted { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>QB Auditor</h1>
  <div id="status" class="status">Loading…</div>
  <p class="muted" id="hint"></p>
  <button id="openOptions">Open settings</button>
  <script src="popup.js"></script>
</body>
</html>
