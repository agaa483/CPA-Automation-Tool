<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QB Auditor — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 620px; margin: 40px auto; padding: 0 20px; color: #111; line-height: 1.5; }
    h1 { font-size: 24px; }
    label { display: block; margin-top: 20px; font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 4px; margin-top: 6px; box-sizing: border-box; background: white; }
    .hint { color: #6b7280; font-size: 13px; margin-top: 4px; }
    button { margin-top: 24px; background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button.secondary { background: white; color: #111; border: 1px solid #d1d5db; margin-left: 10px; }
    button:hover { opacity: 0.9; }
    .status { margin-top: 16px; padding: 10px; border-radius: 4px; font-size: 14px; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.bad { background: #fee2e2; color: #991b1b; }
    code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>QB Auditor — Settings</h1>
  <p>Paste your extension token from the web app dashboard, then pick which client to categorize for.</p>

  <label>Backend URL</label>
  <input id="backendUrl" placeholder="https://qb-auditor-backend.fly.dev" />
  <div class="hint">Leave as default unless you're running your own instance.</div>

  <label>Extension token</label>
  <input id="token" type="password" placeholder="qbaext_..." />
  <div class="hint">Get one from <code>Dashboard → Settings → Chrome extension</code> on the web app.</div>
  <button id="loadClients" class="secondary" style="margin-top: 10px;">Load clients</button>

  <label>Client</label>
  <select id="clientSelect" disabled>
    <option value="">— Enter token and click Load clients —</option>
  </select>

  <button id="save">Save</button>

  <div id="status" style="display:none"></div>

  <script src="options.js"></script>
</body>
</html>
